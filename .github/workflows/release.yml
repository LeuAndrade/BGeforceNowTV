name: APK principal com sua assinatura
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk" ]]; then
            echo '::error::SDK do runner ausente. Use runs-on: ubuntu-24.04.'
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk/build-tools/35.0.0" "$sdk/platform-tools" >> "$GITHUB_PATH"
          missing=()
          if [[ ! -f "$sdk/platforms/android-35/android.jar" || ! -f "$sdk/platforms/android-35/core-for-system-modules.jar" ]]; then
            missing+=('platforms;android-35')
          fi
          if [[ ! -x "$sdk/build-tools/35.0.0/aapt" || ! -x "$sdk/build-tools/35.0.0/zipalign" || ! -x "$sdk/build-tools/35.0.0/apksigner" || ! -f "$sdk/build-tools/35.0.0/lib/d8.jar" ]]; then
            missing+=('build-tools;35.0.0')
          fi
          if (( ${#missing[@]} > 0 )); then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then
              manager="$(command -v sdkmanager || true)"
            fi
            if [[ ! -x "$manager" ]]; then
              echo '::error::sdkmanager ausente no runner. Use runs-on: ubuntu-24.04.'
              exit 1
            fi
            printf 'Instalando componente necessario: %s\n' "${missing[@]}"
            "$manager" --sdk_root="$sdk" --install "${missing[@]}" < <(printf 'y\n%.0s' {1..100})
          else
            echo 'SDK 35 e Build Tools 35.0.0 ja disponiveis; nenhuma reinstalacao necessaria.'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -f "$sdk/platforms/android-35/core-for-system-modules.jar"
          test -x "$sdk/build-tools/35.0.0/aapt"
          test -x "$sdk/build-tools/35.0.0/zipalign"
          test -x "$sdk/build-tools/35.0.0/apksigner"
          test -f "$sdk/build-tools/35.0.0/lib/d8.jar"
          echo 'SDK pronto para compilar e verificar os APKs.'
      - name: Restaurar assinatura privada
        env:
          BGFN_KEYSTORE_B64: ${{ secrets.BGFN_KEYSTORE_B64 }}
        run: |
          test -n "$BGFN_KEYSTORE_B64" || { echo 'Configure a assinatura conforme docs/GITHUB_PASSO_A_PASSO.md'; exit 1; }
          printf '%s' "$BGFN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bgfn.jks"
      - name: Testar e gerar APK principal
        env:
          BGFN_KEYSTORE: ${{ runner.temp }}/bgfn.jks
          BGFN_STORE_PASSWORD: ${{ secrets.BGFN_STORE_PASSWORD }}
          BGFN_KEY_ALIAS: bgfn
          BGFN_KEY_PASSWORD: ${{ secrets.BGFN_STORE_PASSWORD }}
        run: |
          node scripts/check-player.mjs
          gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verificar assinatura, pacote e integridade dos APKs
        run: python3 scripts/verify-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: BGeforce-Now-TV-principal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Limpar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/bgfn.jks"

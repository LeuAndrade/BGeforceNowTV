name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testar e compilar
        run: |
          node scripts/check-player.mjs
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Guardar APKs de desenvolvimento
        uses: actions/upload-artifact@v4
        with:
          name: BGeforce-Now-TV-Dev-APKs
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relatorios
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
